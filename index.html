<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Honeycomb Planner</title>
    <meta
      name="description"
      content="Lay out a Honeycomb Storage Wall on a real hex grid and get an exact print list."
    />

    <!--
      The tab icon. An SVG rather than an .ico because it is three hexagons of
      real lattice (see the note in the file) and stays exact at every size a
      browser asks for.
    -->
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />

    <!--
      The social card.

      `og:image` MUST be absolute — the spec requires it and every consumer
      enforces it, so the `./` that works for everything else here would give a
      grey box in every chat client. That makes this the one place in the app
      that hard-codes the domain; `tools/social.py` draws the picture.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Honeycomb Planner" />
    <meta property="og:title" content="Honeycomb Planner" />
    <meta
      property="og:description"
      content="Lay out a Honeycomb Storage Wall on a real hex grid and get an exact print list."
    />
    <meta property="og:url" content="https://honeycombplanner.com/" />
    <meta property="og:image" content="https://honeycombplanner.com/social-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A honeycomb wall with several parts placed on it, under the Honeycomb Planner wordmark." />
    <meta name="twitter:card" content="summary_large_image" />
    <!--
      If the app throws and leaves #root empty, say so on the page with the
      error, rather than leaving the browser's background — black in dark mode
      — as the only symptom. Plain script, so it runs even when the bundle does
      not.
    -->
    <script>
      window.addEventListener('error', function (event) {
        setTimeout(function () {
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return;
          var box = document.createElement('div');
          box.style.cssText = 'font: 16px/1.5 system-ui, sans-serif; color: CanvasText; background: Canvas; padding: 2rem; max-width: 40rem';
          var title = document.createElement('p');
          title.textContent = 'Honeycomb Planner could not start.';
          title.style.fontWeight = 'bold';
          var detail = document.createElement('pre');
          detail.style.whiteSpace = 'pre-wrap';
          detail.textContent = String((event.error && event.error.stack) || event.message || 'Unknown error');
          box.append(title, detail);
          root.append(box);
        }, 0);
      });
    </script>
  </head>
  <body>
    <!--
      Shown only until the app replaces it. A page that cannot start used to be
      an empty body in the browser's own background — black in dark mode — with
      the reason in the console. System colours, because no stylesheet has
      loaded if this is still on screen.
    -->
    <div id="root">
      <div style="font: 16px/1.5 system-ui, sans-serif; color: CanvasText; background: Canvas; padding: 2rem; max-width: 40rem">
        <p><strong>Honeycomb Planner is loading…</strong></p>
        <p>If this message stays, the app could not start here. Open
        <strong>Honeycomb-Planner.html</strong> (the single-file download), or the
        <strong>index.html</strong> inside the unzipped web build — not the
        <strong>index.html</strong> of the source code, which only runs under
        <code>npm run dev</code>. Or use <a href="https://honeycombplanner.com/">honeycombplanner.com</a>.</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
